<!-- Register Section with Embedded Google Form -->
<section class="bg-light page-section" id="register">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].register.title | markdownify }}</h2>
        {% if site.data.sitetext[site.locale].register.text %}
          <h3 class="section-subheading text-muted">{{ site.data.sitetext[site.locale].register.text }}</h3>
        {% endif %}
      </div>
    </div>
    <div class="row">
      <div class="col-lg-10 mx-auto">
        <!-- Embedded Google Form -->
        <div style="position: relative; overflow: hidden; padding-top: 120%; max-width: 100%; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
          <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSdMGA-BIlfXoL3bqKVHxxmG79w-fgd6PSTgiHsI6kpDiQwYMg/viewform?embedded=true"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
            frameborder="0"
            marginheight="0"
            marginwidth="0">
            Loading…
          </iframe>
        </div>
      </div>
    </div>
  </div>
</section>
