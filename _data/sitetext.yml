en: &DEFAULT_EN
  header:
    title: Welcome to OSM Kenya!
    text: Mapping Kenya, Together
    button: Learn More
    buttonlink: "#services"

  services:
    title: "What We Do"
    text: "Building Kenya's open map through community collaboration. Our mission is to create, maintain, and promote open geospatial data across Kenya by empowering communities, fostering collaboration, and ensuring accessibility for all."
    section: services
    list:
      - title: "Community Mapping"
        desc: "We create projects and organize mapping events across Kenya, bringing together volunteers to map communities, infrastructure, and resources for the benefit of all."
        icon: fas fa-map #find more at https://fontawesome.com/icons
      - title: "Capacity Building"
        desc: "Training and mentoring new mappers, from students to professionals, ensuring everyone can contribute to building an accurate and comprehensive map of Kenya."
        icon: fas fa-chalkboard
      - title: "Data Quality"
        desc: "Maintaining high standards for OpenStreetMap data in Kenya through validation, quality assurance, and continuous improvement of our mapping practices."
        icon: fas fa-check-double

  portfolio:
    title: "Our Projects"
    text: "Mapping initiatives and community projects across Kenya"
    section: portfolio
    closebutton: "Close Project"

