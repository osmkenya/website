  about:
    title: "About OSM"
    text: "OSM Kenya is a local mapping community of both individuals and organizations"
    body: "At OSM Kenya we Map and  Contribute to OpenStreetMap by adding and updating geographical data. We provide learning resources and tutorials for mappers of all levels. This allows mappers to collaborate and work on projects that benefit communities across Kenya to advocate and promote the use of open geospatial data in various sectors Every contribution from tracing roads to adding points of interest helps improve our map."

  team:
    title: "Our Community"
    text: "Meet the People Mapping Kenya"
    subtext: OpenStreetMap Kenya is powered by volunteers from all walks of life - students, professionals, activists, and everyday citizens who believe in the power of open data. Join us in building the map!
    section: team
    people:
      - name: "Community Mappers"
        role: "Volunteers and Organizations Across Kenya. We are actively working towards building a truly national community Whether you are an experienced mapper or new to OpenStreetMap there is a place for you in OSM Kenya."
        image: assets/img/team/image4.webp
        social:
