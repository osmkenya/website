#Color Customization
highlight: "#008B5B"
white: "#e1edd4"
#black: "#000"

# Image Customization
header-image: "../img/header-bg.jpg"
contact-image: "../img/map-image.jpg"

# Font URLs - Import from Google Fonts
fonts_urls:
  - "https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap"
  - "https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600&display=swap"

# Font Assignments
fonts:
  - name: "Outfit"
    for: "heading"
  - name: "Outfit"
    for: "script"
  - name: "Inter"
    for: "serif"
  - name: "Inter"
    for: "body"
