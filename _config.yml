# Site settings
title: OpenStreetMap Kenya
email: info@osmkenya.org #this is also the email contact forms will go to
description: >-
  OpenStreetMap (OSM) Kenya is a volunteer community of mappers, developers, 
  users, and advocates leading the open mapping movement in Kenya.

logo:     #optional, defaults to site title
 path: assets\img\clients\logo.svg
 height: 60 #height in px, defaults to 52px

# URL settings
url    : "https://osmkenya.github.io" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/website2" # the subpath of your site, e.g. /blog

# Language/Locale settings
locale: "en-US" # See available languages in _data/sitetext.yml
lang: "en"

# Social media
twitter_username: OSMkenya
github_username: osmkenya

#theme: jekyll-agency
remote_theme: raviriley/agency-jekyll-theme

# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-favicon

# Favicon config
favicon: favicon.png

# Collections for portfolio items
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  
# Defaults
defaults:
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio-item"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - LICENSE
  - "*.sh"

# Timezone
timezone: Africa/Nairobi
encoding: utf-8

# Analytics (optional)
analytics:
  google: # Add your Google Analytics tracking code if needed


author: Laura Mugeha

